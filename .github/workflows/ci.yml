# CI：构建两侧产物 + 跑全量验证脚本。
#
# 说明：
# - `@deepseek-ai/*` 是 peerDependencies（devDependencies 里镜像了一份精确版本），
#   由公共 registry 解析；若你的环境用的是内网镜像，在这里补 registry 配置。
# - 验证脚本不需要浏览器：它把 lib/client.js 跑在 Node 的 VM + 假 DOM 里断言。
#
# **安装步骤刻意与社区市场验证器对齐**（见 dsh-plugins-store 的
# `scripts/validation/linux-sandbox.ts`）：那边固定用 pnpm 11.19.0，并按
# 「有 pnpm-lock.yaml 就跑 --frozen-lockfile」选命令。所以这里也钉同一个 pnpm
# 版本并加 `--ignore-scripts`，否则锁文件一旦与 package.json 不同步，CI 会绿而
# 市场实机验证会红（0.7.0 就这么踩过一次：锁文件里这三个包还挂在 dependencies）。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 用 action 直接装指定版本，**不要用 corepack**：
      # corepack 的 pnpm shim 在这里会在 1 秒内失败（无 packageManager 字段时
      # shim 的版本解析路径与 prepare --activate 不一致），而市场验证器用的是
      # 工具链里直接安装的 pnpm 11.19.0，不走 corepack。这里与它保持一致。
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version

      - name: Install (市场验证器同款命令)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build both halves
        run: npm run build

      - name: Verify (structure + engine + tool + settings assertions)
        run: npm run verify
